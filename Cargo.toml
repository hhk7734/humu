[package]
name = "humu"
version = "0.2.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"
vt100 = { path = "third_party/vt100" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
dirs = "6"
anyhow = "1"
serde_json = "1"
axum = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.12.3"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
base64 = "0.22"
hostname = "0.4"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
